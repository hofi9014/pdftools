# Weekly pull requests for outdated dependencies. Each one runs the CI workflow before anything
# can be merged; nothing is merged or deployed automatically.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates of everything in one PR instead of dozens.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types must match the Node that runs the code: 24 on Vercel (project setting) and in CI
      # (ci.yml). Move this together with both when the runtime moves to a new major version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @types/pako 3 is an empty stub for pako 3, which ships its own types; the pako this app
      # imports is 1.x (through pdf-lib and jszip), which needs @types/pako 2.
      - dependency-name: "@types/pako"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler) has no JavaScript API, and typescript-eslint, which
      # eslint-config-next uses, supports TypeScript below 6.1 only: with 7, `eslint` does not
      # start at all. tsc and next build pass on 7. Drop this once typescript-eslint supports it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
